<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ff">
  <title>Flat Finder — Homes & Society Intelligence</title>
  <meta name="description" content="Search homes across India, compare rents and sale properties, and explore deeper housing-society research on one map.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/shell.css">
</head>
<body>
  <header class="shell-header">
    <a class="shell-brand" href="/" aria-label="Flat Finder home">
      <span class="shell-mark">⌂</span>
      <span class="shell-brand-copy"><strong>Flat Finder</strong><small>Find home. Live better.</small></span>
    </a>
    <div class="shell-message">Home search + society intelligence, together</div>
    <nav class="shell-tabs" role="tablist" aria-label="Flat Finder tools">
      <button class="shell-tab active" id="tab-homes" type="button" role="tab" aria-selected="true" aria-controls="view-homes" data-tab="homes">
        <span class="tab-icon">⌕</span><span>Find homes</span>
      </button>
      <button class="shell-tab" id="tab-research" type="button" role="tab" aria-selected="false" aria-controls="view-research" data-tab="research">
        <span class="tab-icon">⌖</span><span>Society research</span>
      </button>
    </nav>
    <button class="shell-auth-button" id="shell-auth-button" type="button">Sign in</button>
  </header>
  <main class="shell-main">
    <section class="shell-view active" id="view-homes" role="tabpanel" aria-labelledby="tab-homes">
      <iframe id="frame-homes" title="India-wide home search" src="/marketplace.html?embed=1" loading="eager"></iframe>
    </section>
    <section class="shell-view" id="view-research" role="tabpanel" aria-labelledby="tab-research" hidden>
      <iframe id="frame-research" title="Interactive housing society research map" data-src="/research.html?embed=1" loading="lazy"></iframe>
    </section>
  </main>
  <script type="module" src="/src/shell.js"></script>
</body>
</html>
