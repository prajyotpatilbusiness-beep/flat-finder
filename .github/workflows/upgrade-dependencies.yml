name: Upgrade audited frontend dependencies

on:
  push:
    branches:
      - security/hardening-nov-2026

permissions:
  contents: write

concurrency:
  group: flat-finder-dependency-upgrade
  cancel-in-progress: false

jobs:
  upgrade-test-and-record:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out security branch
        uses: actions/checkout@v4
        with:
          ref: security/hardening-nov-2026
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Upgrade known vulnerable direct dependencies
        run: npm install --save-exact maplibre-gl@6.19.0 vite@6.4.6 vitest@5.1.1
      - name: Audit upgraded dependency tree
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Run project tests
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Commit validated package manifest and lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json web/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade vulnerable frontend dependencies"
            git push origin security/hardening-nov-2026
          else
            echo "No dependency changes to commit."
          fi
