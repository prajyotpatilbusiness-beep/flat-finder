name: web-check
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "web/**"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify all app pages are published
        run: |
          test -f dist/index.html
          test -f dist/marketplace.html
          test -f dist/research.html
      - run: npm test
