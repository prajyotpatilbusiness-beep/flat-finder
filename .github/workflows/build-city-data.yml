name: Build city research data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/trigger-bangalore-launch.txt"

permissions:
  contents: write
  actions: read

concurrency:
  group: bangalore-partial-publish-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish available Bengaluru research
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore saved Bengaluru index and completed batches
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 44945612463
          pattern: bangalore-*
          path: pipeline/out/bangalore
          merge-multiple: true
      - name: Import any authorized 99acres and NoBroker feeds
        run: python pipeline/portal_import.py bangalore
      - name: Merge completed batches and record incomplete coverage
        run: python pipeline/mb_crawl.py merge-partial bangalore
      - name: Collect map context and build Bengaluru dataset
        run: |
          python pipeline/osm_fetch.py bangalore
          python pipeline/build_city.py bangalore
      - name: Validate partial dataset before publishing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data_path = Path("web/public/data/bangalore.json")
          shapes_path = Path("web/public/data/bangalore-shapes.geojson")
          if not data_path.is_file() or not shapes_path.is_file():
              raise SystemExit("Missing generated Bengaluru files.")
          data = json.loads(data_path.read_text(encoding="utf-8"))
          coverage = data.get("collection") or {}
          listed = int(data.get("counts", {}).get("listed", 0))
          mapped = int(data.get("counts", {}).get("on_map", 0))
          if not coverage or coverage.get("collected") != listed:
              raise SystemExit("Collection coverage does not match the generated dataset.")
          if not mapped:
              raise SystemExit("No Bengaluru societies were mapped; refusing to publish.")
          if coverage.get("expected", 0) < coverage.get("collected", 0):
              raise SystemExit("Collection count exceeds the saved index.")
          print(
              f"Validated {data['city']['name']}: {mapped:,} mapped societies; "
              f"{coverage['collected']:,}/{coverage['expected']:,} project details collected."
          )
          print("Missing project ranges:", coverage.get("missing_ranges", []))
          print("Portal feed counts:", data.get("portal_feeds", {}))
          PY
      - name: Commit generated Bengaluru website data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            web/public/data/bangalore.json \
            web/public/data/bangalore-details.json \
            web/public/data/bangalore-shapes.geojson \
            web/public/data/bangalore-societies.csv \
            web/public/data/bangalore-units.csv \
            web/public/data/cities.json
          if git diff --cached --quiet; then
            echo "No generated Bengaluru data changes to publish."
            exit 0
          fi
          git commit -m "Publish partial Bengaluru society research dataset"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
